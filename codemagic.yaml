workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_pro
    max_build_duration: 60
    
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_id: com.ewastecare.app  # Update with your bundle ID
      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        SWIFT_PACKAGE_MANAGER: false
      xcode: latest
      flutter: stable
    
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
          cd ios && pod install && cd ..
      
      - name: Build iOS
        script: |
          flutter build ios --release \
            --no-codesign \
            --no-swift-package-manager
      
      - name: Package for distribution
        script: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath build/ios_build \
            -archivePath build/ios_build/Runner.xcarchive \
            archive
          cd ..
    
    artifacts:
      - build/ios_build/Runner.xcarchive
    
    publishing:
      app_store_connect:
        auth: integration

  ios-debug:
    name: iOS Debug Build
    instance_type: mac_mini
    max_build_duration: 30
    
    environment:
      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        SWIFT_PACKAGE_MANAGER: false
      xcode: latest
      flutter: stable
    
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
          cd ios && pod install && cd ..
      
      - name: Build iOS Debug
        script: |
          flutter build ios --debug \
            --no-codesign \
            --no-swift-package-manager
    
    artifacts:
      - build/ios/iphoneos
